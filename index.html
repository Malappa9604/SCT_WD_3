<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            background: linear-gradient(135deg, #10142c, #25134b, #102b4e);
        }

        .game-container {
            width: 100%;
            max-width: 470px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            backdrop-filter: blur(15px);
        }

        .tagline {
            color: #b8b8d8;
            margin: 10px 0 25px;
            font-size: 14px;
        }

        h1 {
            font-size: clamp(28px, 7vw, 38px);
            letter-spacing: 1px;
        }

        h1 span {
            color: #a78bfa;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        button {
            font: inherit;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid #55517c;
            border-radius: 12px;
            color: white;
            background: #292547;
        }

        .mode-btn.active {
            background: #7c3aed;
            border-color: #a78bfa;
            box-shadow: 0 4px 15px #7c3aed55;
        }

        .mode-btn:hover,
        .action-btn:hover {
            transform: translateY(-2px);
        }

        .status {
            min-height: 28px;
            margin-bottom: 17px;
            color: #ddd6fe;
            font-size: 17px;
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .cell {
            aspect-ratio: 1;
            border: 1px solid #514b7c;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: clamp(40px, 12vw, 60px);
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell:hover:not(:disabled) {
            background: rgba(167,139,250,0.18);
            border-color: #a78bfa;
            transform: scale(1.03);
        }

        .cell:disabled {
            cursor: default;
        }

        .cell.x {
            color: #60a5fa;
        }

        .cell.o {
            color: #f472b6;
        }

        .cell.winner {
            background: #15803d;
            color: white;
            border-color: #86efac;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        .scores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .score-card {
            padding: 14px 5px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        .score-card p {
            color: #c4b5fd;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .score-card strong {
            font-size: 25px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 13px 8px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
        }

        .restart {
            background: #8b5cf6;
            color: white;
        }

        .reset {
            background: #e5e7eb;
            color: #25213e;
        }

        .footer {
            color: #a5a2c6;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 20px 15px;
            }

            .mode-btn {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="game-container">
        <h1>TIC <span>TAC</span> TOE</h1>
        <p class="tagline">Think smart. Make your move. Win the game!</p>

        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="computer">
                🤖 Vs Computer
            </button>
            <button class="mode-btn" data-mode="player">
                👥 2 Players
            </button>
        </div>

        <p class="status" id="status" aria-live="polite">
            Your turn — X
        </p>

        <div class="board" id="board" aria-label="Tic-Tac-Toe board">
            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>
            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>
            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <div class="scores">
            <div class="score-card">
                <p>PLAYER X</p>
                <strong id="scoreX">0</strong>
            </div>
            <div class="score-card">
                <p>DRAWS</p>
                <strong id="scoreDraw">0</strong>
            </div>
            <div class="score-card">
                <p id="playerOLabel">COMPUTER O</p>
                <strong id="scoreO">0</strong>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn restart" id="restart">
                ↻ Restart Round
            </button>
            <button class="action-btn reset" id="reset">
                Reset Scores
            </button>
        </div>

        <p class="footer">Made with ❤️ using HTML, CSS & JavaScript</p>
    </main>

    <script>
        // Game elements
        const cells = document.querySelectorAll(".cell");
        const statusText = document.getElementById("status");
        const modeButtons = document.querySelectorAll(".mode-btn");
        const scoreXText = document.getElementById("scoreX");
        const scoreOText = document.getElementById("scoreO");
        const scoreDrawText = document.getElementById("scoreDraw");
        const playerOLabel = document.getElementById("playerOLabel");

        // All possible winning combinations
        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        // Game state
        let board = Array(9).fill("");
        let currentPlayer = "X";
        let gameActive = true;
        let gameMode = "computer";

        let scores = {
            X: 0,
            O: 0,
            draws: 0
        };

        // Handle player clicks
        cells.forEach(cell => {
            cell.addEventListener("click", () => {
                const index = Number(cell.dataset.index);

                if (!gameActive || board[index] !== "") {
                    return;
                }

                // Prevent clicks during the computer's turn
                if (gameMode === "computer" && currentPlayer === "O") {
                    return;
                }

                makeMove(index, currentPlayer);

                if (!gameActive) return;

                // Computer responds after the human moves
                if (gameMode === "computer" && currentPlayer === "O") {
                    statusText.textContent = "Computer is thinking...";
                    setTimeout(computerMove, 350);
                }
            });
        });

        // Make a move and update the board
        function makeMove(index, player) {
            if (!gameActive || board[index] !== "") return;

            board[index] = player;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());
            cells[index].setAttribute(
                "aria-label",
                `Cell ${index + 1}: ${player}`
            );
            cells[index].disabled = true;

            if (checkWinner(player)) {
                gameActive = false;
                scores[player]++;
                updateScores();

                statusText.textContent =
                    gameMode === "computer"
                        ? (player === "X"
                            ? "🎉 You win! Amazing!"
                            : "🤖 Computer wins!")
                        : `🎉 Player ${player} wins!`;

                return;
            }

            if (board.every(cell => cell !== "")) {
                gameActive = false;
                scores.draws++;
                updateScores();
                statusText.textContent = "🤝 It's a draw!";
                return;
            }

            currentPlayer = player === "X" ? "O" : "X";

            if (gameMode === "computer") {
                statusText.textContent =
                    currentPlayer === "X"
                        ? "Your turn — X"
                        : "Computer's turn — O";
            } else {
                statusText.textContent = `Player ${currentPlayer}'s turn`;
            }
        }

        // Check for a winning combination
        function checkWinner(player) {
            const combination = winningCombinations.find(combo =>
                combo.every(index => board[index] === player)
            );

            if (combination) {
                combination.forEach(index => {
                    cells[index].classList.add("winner");
                });
                return true;
            }

            return false;
        }

        // Computer strategy: win, block, take center, take corner
        function computerMove() {
            if (!gameActive || gameMode !== "computer" ||
                currentPlayer !== "O") return;

            let move = findStrategicMove("O");

            // Block the player from winning
            if (move === -1) {
                move = findStrategicMove("X");
            }

            // Prefer center
            if (move === -1 && board[4] === "") {
                move = 4;
            }

            // Prefer a corner
            if (move === -1) {
                const corners = [0, 2, 6, 8].filter(
                    index => board[index] === ""
                );

                if (corners.length) {
                    move = corners[
                        Math.floor(Math.random() * corners.length)
                    ];
                }
            }

            // Otherwise choose any free cell
            if (move === -1) {
                const available = board
                    .map((value, index) => value === "" ? index : -1)
                    .filter(index => index !== -1);

                if (available.length) {
                    move = available[
                        Math.floor(Math.random() * available.length)
                    ];
                }
            }

            if (move !== -1) {
                makeMove(move, "O");
            }
        }

        // Find a move that completes a line for the given player
        function findStrategicMove(player) {
            for (const combination of winningCombinations) {
                const values = combination.map(index => board[index]);
                const playerCount = values.filter(
                    value => value === player
                ).length;
                const emptyCount = values.filter(
                    value => value === ""
                ).length;

                if (playerCount === 2 && emptyCount === 1) {
                    return combination.find(index => board[index] === "");
                }
            }

            return -1;
        }

        // Start a new round without clearing scores
        function restartRound() {
            board = Array(9).fill("");
            currentPlayer = "X";
            gameActive = true;

            cells.forEach((cell, index) => {
                cell.textContent = "";
                cell.disabled = false;
                cell.className = "cell";
                cell.setAttribute("aria-label", `Cell ${index + 1}`);
            });

            statusText.textContent =
                gameMode === "computer"
                    ? "Your turn — X"
                    : "Player X's turn";
        }

        // Switch between game modes
        modeButtons.forEach(button => {
            button.addEventListener("click", () => {
                gameMode = button.dataset.mode;

                modeButtons.forEach(btn => {
                    btn.classList.toggle("active", btn === button);
                });

                playerOLabel.textContent =
                    gameMode === "computer" ? "COMPUTER O" : "PLAYER O";

                restartRound();
            });
        });

        // Update the score display
        function updateScores() {
            scoreXText.textContent = scores.X;
            scoreOText.textContent = scores.O;
            scoreDrawText.textContent = scores.draws;
        }

        // Restart current round
        document.getElementById("restart").addEventListener(
            "click", restartRound
        );

        // Reset scores and start a fresh round
        document.getElementById("reset").addEventListener("click", () => {
            scores = { X: 0, O: 0, draws: 0 };
            updateScores();
            restartRound();
        });
    </script>

</body>
</html>
